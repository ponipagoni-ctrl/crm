name: Поиск клиентов (Дед Мороз)

on:
  schedule:
    # не ровно :00/:30 — в эти минуты GitHub сильнее всего задерживает расписания
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Прислать в бот отчёт о проверке источников'
        type: boolean
        default: true
      digest:
        description: 'Прислать сводку (тендеры, новые источники) прямо сейчас'
        type: boolean
        default: false
      tenders_only:
        description: 'Только проверить тендеры и вывести в лог (в бот ничего не слать)'
        type: boolean
        default: false
      crm_test:
        description: 'Записать в CRM тестовый лид (проверка связи)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: leads-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Состояние (отправленные посты, одобренные источники, тендеры) храним
      # в кэше Actions, а не в репозитории: репозиторий открытый, а это
      # сообщения реальных людей.
      - uses: actions/cache@v4
        with:
          path: .leads-state
          key: leads-seen-${{ github.run_id }}
          restore-keys: leads-seen-

      # Для записи лидов в CRM (Firestore) по ключу сервисного аккаунта
      - name: Установить google-auth
        run: pip install --quiet google-auth requests

      - name: Проверить источники
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STATE_DIR: .leads-state
          SEND_REPORT: ${{ inputs.report && '1' || '0' }}
          FORCE_DIGEST: ${{ inputs.digest && '1' || '0' }}
          TENDERS_ONLY: ${{ inputs.tenders_only && '1' || '0' }}
          CRM_TEST: ${{ inputs.crm_test && '1' || '0' }}
        run: python3 leads/monitor.py
